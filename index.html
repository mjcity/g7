<head>

  <title>Grade 7 Study Guides</title>
  <style>
    * { box-sizing: border-box; }

    main { max-width: 640px; margin: 8vh auto; }
    h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.15; }

    a:focus-visible { outline: 3px solid #207ba9; outline-offset: 4px; }

  <main>
    <h1>Grade 7 study guides</h1>
    <p>Choose a guide to explore, practice, and test your understanding.</p>
